name: Release APK

# 首次 push 到 main 时自动构建 APK 并发布 v2.0 Release；
# 之后仅在手动触发时重新发布，避免每次提交都重发。
# 私钥不入库：CI 用临时生成的 debug keystore 签名。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 组件
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --install "platforms;android-34" "build-tools;36.1.0" > /dev/null || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || true

      - name: 构建单文件网页版
        run: python tools/assemble.py

      - name: 构建并签名 APK
        run: python tools/build_apk.py

      - name: 检查 Release 是否已存在
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.0 > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布 v2.0 Release
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: 滚球迷宫 v2.0
          body_path: docs/RELEASE_NOTES.md
          files: dist/tilt-maze.apk
          fail_on_unmatched_files: true
