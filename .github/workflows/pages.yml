name: Deploy Pages

# 把 dist/index.html 部署为 GitHub Pages 在线试玩版。
# 首次使用：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"，
# 然后手动触发本 workflow（或 push 一次 main）。
# 未启用 Pages 时优雅跳过、保持绿灯，不会留下一个失败的 run。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成单文件网页版
        run: python tools/assemble.py

      # 仓库尚未启用 Pages 时 configure-pages 会报错；允许失败并在下一步给出提示
      - name: 检查 Pages 是否可用
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: 提示如何启用 Pages
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::GitHub Pages 尚未启用：Settings → Pages → Source 选 GitHub Actions，然后重新运行本 workflow"

      - name: 上传站点产物
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
